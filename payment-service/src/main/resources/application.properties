spring.application.name=payment-service
server.port=8082

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/quickbite_payment_db
spring.datasource.username=root
spring.datasource.password=root

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Circuit Breaker - Resilience4j Configuration
resilience4j.circuitbreaker.instances.paymentGateway.slidingWindowSize=10
resilience4j.circuitbreaker.instances.paymentGateway.failureRateThreshold=50
resilience4j.circuitbreaker.instances.paymentGateway.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.paymentGateway.permittedNumberOfCallsInHalfOpenState=3

# Retry Configuration
resilience4j.retry.instances.paymentGateway.maxAttempts=3
resilience4j.retry.instances.paymentGateway.waitDuration=1s

# Payment Gateway Configuration - Environment Variables
WEBPAY_API_KEY=${WEBPAY_API_KEY:}
WEBPAY_API_SECRET=${WEBPAY_API_SECRET:}
WEBPAY_COMMERCE_CODE=${WEBPAY_COMMERCE_CODE:}
WEBPAY_ENVIRONMENT=${WEBPAY_ENVIRONMENT:integration}

MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN:}
MERCADOPAGO_PUBLIC_KEY=${MERCADOPAGO_PUBLIC_KEY:}
MERCADOPAGO_ENVIRONMENT=${MERCADOPAGO_ENVIRONMENT:sandbox}

# External Services Configuration
ORDER_SERVICE_URL=${ORDER_SERVICE_URL:http://localhost:8081}
KITCHEN_SERVICE_URL=${KITCHEN_SERVICE_URL:http://localhost:8083}

# JWT Configuration
JWT_SECRET=${JWT_SECRET:quickbite-secret-key-for-development-change-in-production}
JWT_EXPIRATION=${JWT_EXPIRATION:86400000}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# HTTPS/TLS Configuration for Production
server.ssl.enabled=${SERVER_SSL_ENABLED:false}
server.ssl.key-store=${SERVER_SSL_KEYSTORE:classpath:keystore.p12}
server.ssl.key-store-password=${SERVER_SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=${SERVER_SSL_KEYSTORE_TYPE:PKCS12}
server.ssl.key-alias=${SERVER_SSL_KEY_ALIAS:quickbite-payment}

# HTTP to HTTPS redirect (if SSL is enabled)
server.http.port=${SERVER_HTTP_PORT:8080}
server.port=${SERVER_HTTPS_PORT:8443}

# Security Headers
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=${COOKIE_HTTP_ONLY:true}
security.headers.frame-options=DENY
security.headers.content-type-options=nosniff
security.headers.xss-protection=1; mode=block
